# nav2_asv.yaml
# Parameter Nav2 untuk ASV kustom di VRX (Gazebo Garden) - ROS 2 Humble
# Dipakai lewat: ros2 launch nav2_bringup navigation_launch.py \
#                  use_sim_time:=true params_file:=<path ke file ini>
#
# Frame: map -> odom -> wamv/base_link  (diisi oleh asv_control/odom_from_sim.py)
# Output: /cmd_vel  -> asv_control/thrust_allocator.py -> thrusters/{left,right}/thrust

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: wamv/base_link
    odom_topic: /odom

    # bt_loop_duration 10 ms (default) = BT tick 100 Hz. Di RTF rendah itu
    # memicu spam "Behavior Tree tick rate 100.00 was exceeded!" dan bikin
    # ComputePathToPose kehabisan waktu -> action di-abort di tengah jalan.
    # 50 ms = 20 Hz, masih jauh lebih cepat dari kebutuhan ASV 0.6 m/s.
    bt_loop_duration: 50
    default_server_timeout: 100
    wait_for_service_timeout: 1000

    # plugin_lib_names sengaja TIDAK ditulis: bt_navigator Humble sudah punya
    # daftar default lengkap di dalam node-nya. Menulis ulang cuma menambah
    # risiko salah nama plugin -> node gagal start.

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # Default 0.3 s: kalau controller gagal menghitung selama 0.3 s berturut,
    # langsung abort. Di RTF rendah 0.3 s wall-clock terlampaui dengan mudah.
    failure_tolerance: 1.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8
      yaw_goal_tolerance: 0.6

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6

      # min_lookahead_dist WAJIB > xy_goal_tolerance (0.8).
      # Kalau tidak: saat kecepatan 0, lookahead jatuh ke min_lookahead_dist,
      # jarak carrot < goal_dist_tol_ -> shouldRotateToGoalHeading() true ->
      # linear_vel dipaksa 0 -> kecepatan tetap 0 -> deadlock permanen.
      lookahead_dist: 1.5
      min_lookahead_dist: 1.2
      max_lookahead_dist: 3.0
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true

      rotate_to_heading_angular_vel: 0.4
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 0.8
      allow_reversing: false

      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0

      # Belum ada /map dari ORB-SLAM3, costmap masih kosong -> deteksi
      # tabrakan tidak berguna dan hanya membuang CPU.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: wamv/base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.25
      robot_radius: 0.40
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: wamv/base_link

      # rolling_window: true + tanpa static_layer = sementara, selama ORB-SLAM3
      # belum menerbitkan /map. Sesuai keputusan Tahap 5.1: begitu /map ada,
      # ganti ke rolling_window: false dan tambahkan static_layer.
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.5
      robot_radius: 0.40
      track_unknown_space: true
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    # Diturunkan dari 1.0: di RTF rendah planner tidak pernah sanggup 1 Hz,
    # jadi 1.0 hanya menghasilkan warning terus-menerus.
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.8
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    # Humble memakai costmap_topic / footprint_topic.
    # (docs.nav2.org menampilkan local_costmap_topic/global_costmap_topic,
    #  itu versi yang lebih baru - salah untuk Humble, node gagal start.)
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: wamv/base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 5.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [x, y, theta]. y = 0 karena ASV non-holonomik (differential thrust).
    max_velocity: [0.6, 0.0, 0.6]
    min_velocity: [-0.3, 0.0, -0.6]
    max_accel: [0.4, 0.0, 0.5]
    max_decel: [-0.4, 0.0, -0.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    odom_topic: "/odom"
    odom_duration: 0.1